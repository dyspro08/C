<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>채팅 서비스 이전 안내</title>
  <!-- 메타 태그를 통한 자동 이동 백업 -->
  <meta http-equiv="refresh" content="5;url=https://dyspro08.github.io/chat">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #1e1f22;
      color: #f2f3f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #2b2d31;
      border-radius: 12px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      border: 1px solid #35363c;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #b5bac1;
      margin-bottom: 24px;
    }
    .notice-box {
      background-color: #1e1f22;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      color: #949ba4;
      margin-bottom: 28px;
      word-break: break-all;
      border: 1px solid #2b2d31;
    }
    .notice-box span {
      color: #5865f2;
      font-weight: 600;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      background-color: #5865f2;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #4752c4;
    }
    .countdown {
      margin-top: 16px;
      font-size: 13px;
      color: #80848e;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚀</div>
    <h1>채팅 서비스 이전 안내</h1>
    <p>
      기존 채팅 서비스 운영이 종료되었으며,<br>
      새로운 채팅 서비스로 이전되었습니다. 여기 닫을거임.
    </p>
    <div class="notice-box">
      새 주소: <span>https://dyspro08.github.io/chat</span>
    </div>
    <a href="https://dyspro08.github.io/chat" class="btn">새 채팅 사이트로 이동하기</a>
    <div class="countdown">
      <span id="seconds">5</span>초 후 자동으로 이동합니다...
    </div>
  </div>

  <script>
    let count = 5;
    const secondsEl = document.getElementById('seconds');
    const timer = setInterval(() => {
      count--;
      if (secondsEl) secondsEl.textContent = count;
      if (count <= 0) {
        clearInterval(timer);
        window.location.href = "https://dyspro08.github.io/chat";
      }
    }, 1000);
  </script>
</body>
</html>
